# KHỐI B8 (quan sát) — docs/ARCHITECTURE.md §4. Grafana hỏi Prometheus bằng PromQL;
# các truy vấn nằm trong lab/grafana/dashboards/xdp-firewall.json (trường "expr").
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus          # uid cố định để dashboard JSON tham chiếu
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 1s       # khớp scrape_interval
